const WORKS = [{"slug": "lashuna-kalpa-rasnadi-taila-uttar-basti-artava-kshya", "type": "Thesis", "typeLabel": "M.S. (Ayurveda) Dissertation", "title": "A Clinical Study of Lashuna Kalpa & Rasnadi Taila Uttar Basti in Artava Kshaya w.s.r. to Hypomenorrhoea", "hook": "Can a simple oil-based Uttar Basti measurably restore menstrual flow in arthava kshaya? This randomised clinical study answers the question in 30 women.", "abstract": "Artava Kshaya (hypomenorrhoea) is a common menstrual complaint in reproductive-age women and a frequent cause of fertility concern. This randomised clinical study was undertaken in the Department of Prasuti Tantra & Stree Roga, Dr. N.R.S. Govt. Ayurvedic College, Vijayawada, to evaluate the efficacy of Lashuna Kalpa and Rasnadi Taila administered by Uttar Basti in the management of Artava Kshaya w.s.r. to Hypomenorrhoea. A sample of 30 subjects diagnosed with Artava Kshaya was recruited from the outpatient department of Prasuti Tantra and Stree Roga at Achanta Lakshmipathi Ayurvedic Hospital, Vijayawada. Diagnosis followed the classical vyadhi pratyatma lakshana — yathochita kala adarshanam (intermenstrual interval over 35 days), alpartava (reduced quantity of menstrual blood) and yoni vedana (lower abdominal pain) — in women aged 18–40 with scanty bleeding for two to three consecutive months, with anaemia, systemic illness, endocrine disorders and androgen-producing tumours excluded. Intervention combined oral Lashuna Kalpa churna (12 g twice daily with ksheera, ghrita or navaneet) with Rasnadi Taila administered by Uttar Basti. Each subject was assessed on an individual proforma covering history, physical signs and symptoms, dosha and dushya pareeksha, with the findings categorised and scored and analysed statistically. Lashuna Kalpa was prepared as a fine churna of shade-dried clove, and Rasnadi Taila was prepared from the classical kwatha and kalka dravyas — rasna, yashtimadhu, devadaru, malati, bala, chitraka, guduchi, kantakari and yuthika — boiled with jala, gomutra and godugdha in moorchita tila taila to madhyama paka. The findings support the use of Uttar Basti as a safe, low-cost, non-invasive and clinically effective intervention in Artava Kshaya, with significant improvement in the assessed clinical parameters.", "keywords": "Artava Kshaya; Hypomenorrhoea; Lashuna Kalpa; Rasnadi Taila; Uttar Basti; Prasuti Tantra; Stree Roga; Ayurveda; Clinical trial", "year": 2025, "url": "https://www.drnidhi.net/writing/lashuna-kalpa-rasnadi-taila-uttar-basti-artava-kshya.html", "pdf": "https://www.drnidhi.net/writing/files/lashuna-kalpa-rasnadi-taila-uttar-basti-artava-kshya.pdf", "source": "https://www.drnidhi.net/writing/files/lashuna-kalpa-rasnadi-taila-uttar-basti-artava-kshya-source.pdf", "apa": "Dr. Nidhi Sanjay Patel (2025). A Clinical Study of Lashuna Kalpa & Rasnadi Taila Uttar Basti in Artava Kshaya w.s.r. to Hypomenorrhoea [Unpublished master’s dissertation]. Dr. N.T.R. University of Health Sciences, Vijayawada. Dr. N.R.S. Govt. Ayurvedic College, Vijayawada, Andhra Pradesh.", "vancouver": "1. Dr. Nidhi Sanjay Patel. A Clinical Study of Lashuna Kalpa & Rasnadi Taila Uttar Basti in Artava Kshaya w.s.r. to Hypomenorrhoea [dissertation]. Dr. N.T.R. University of Health Sciences, Vijayawada; 2025.", "bibtex": "@phdthesis{a-clinical-study-of-lashuna-kalpa-rasnad,\n  author = {Dr. Nidhi Sanjay Patel},\n  title = {A Clinical Study of Lashuna Kalpa & Rasnadi Taila Uttar Basti in Artava Kshaya w.s.r. to Hypomenorrhoea},\n  year = {2025},\n  school = {Dr. N.T.R. University of Health Sciences, Vijayawada},\n  keywords = {Artava Kshaya, Hypomenorrhoea, Lashuna Kalpa, Rasnadi Taila, Uttar Basti}\n}", "platforms": [{"key": "zenodo", "priority": 1}, {"key": "orcid", "priority": 1}, {"key": "scholar", "priority": 1}, {"key": "osf", "priority": 1}, {"key": "researchgate", "priority": 1}, {"key": "academia", "priority": 2}, {"key": "linkedin", "priority": 2}, {"key": "scribd", "priority": 3}]}, {"slug": "role-of-uttarbasti-in-yonivyapada", "type": "Abstract", "typeLabel": "Conference Abstract", "title": "Role of Uttarbasti in Yonivyapada", "hook": "Vata is the only dosha with motility — and it drives most women's diseases. This abstract explains why retrograde oil instillation reaches where oral drugs cannot.", "abstract": "Without Tridosha, no disease can form or manifest. Of the three, Kapha and Pitta are non-motile, while motility is attributed exclusively to Vata — and it therefore follows that vitiation of Kapha and Pitta most often requires an initiation from Vata Dosha. Basti has good therapeutic efficacy in normalising a vitiated Vata, which makes it a rational primary intervention in Yonivyapada, the umbrella term in Stri Roga covering almost all diseases of women. Uttarbasti carries both Shamana and Shodhana effects, and the drugs used in it are prepared in an oil base; depending on the condition, the formulation properties that act are Ushna, Tikshna, Vyavayi, sometimes Sheeta, Balya and Brimhana. The proposed mode of action is Srotoshuddhikara — the clearing of the srotas — together with stimulation of follicular cells and nourishment of the endometrium. Properly performed Uttarbasti produces desirable effects on several parameters of the female reproductive system.", "keywords": "Uttar Basti; Yonivyapada; Tridosha; Vata; Srotoshuddhi; Endometrium; Reproductive health; Ayurveda", "year": 2024, "url": "https://www.drnidhi.net/writing/role-of-uttarbasti-in-yonivyapada.html", "pdf": "https://www.drnidhi.net/writing/files/role-of-uttarbasti-in-yonivyapada.pdf", "source": "https://www.drnidhi.net/writing/files/role-of-uttarbasti-in-yonivyapada-source.docx", "apa": "Dr. Nidhi Sanjay Patel (2024). Role of Uttarbasti in Yonivyapada [Conference abstract]. AADHYA National Conference (Uttarbasti Session).", "vancouver": "1. Dr. Nidhi Sanjay Patel. Role of Uttarbasti in Yonivyapada [abstract]. AADHYA National Conference (Uttarbasti Session); 2024.", "bibtex": "@misc{role-of-uttarbasti-in-yonivyapada,\n  author = {Dr. Nidhi Sanjay Patel},\n  title = {Role of Uttarbasti in Yonivyapada},\n  year = {2024},\n  school = {AADHYA National Conference (Uttarbasti Session)},\n  keywords = {Uttar Basti, Yonivyapada, Tridosha, Vata, Srotoshuddhi}\n}", "platforms": [{"key": "zenodo", "priority": 1}, {"key": "researchgate", "priority": 1}, {"key": "orcid", "priority": 2}, {"key": "scholar", "priority": 2}, {"key": "academia", "priority": 2}]}, {"slug": "role-of-panchakarma-in-vandhyatwa", "type": "Abstract", "typeLabel": "Conference Abstract", "title": "The Role of Panchakarma in Vandhyatwa (Female Infertility): A Comprehensive Review", "hook": "Female infertility is rarely a one-herb problem. This review maps where classical Panchakarma fits into the modern fertility pathway.", "abstract": "Vandhyatwa (female infertility) is one of the most common yet least discussed clinical presentations in Prasuti Tantra. This comprehensive review evaluates the role of Panchakarma in the management of female infertility, examining both Shodhana (purificatory) and Shamana (palliative) approaches as described in classical texts. The review covers the indications for Virechana, Vamana, Basti and Nasya in the context of reproductive disorders, together with the role of Ahara (diet), Vihara (lifestyle) and Dinacharya as the foundational substrate of any fertility protocol. The paper argues that Panchakarma works best not as an isolated procedure but as the preparatory and corrective stage that makes subsequent conception-oriented care effective, and it discusses the contemporary literature supporting these classical indications.", "keywords": "Panchakarma; Vandhyatwa; Female infertility; Shodhana; Shamana; Ayurveda; Reproductive health; Review", "year": 2024, "url": "https://www.drnidhi.net/writing/role-of-panchakarma-in-vandhyatwa.html", "pdf": "https://www.drnidhi.net/writing/files/role-of-panchakarma-in-vandhyatwa.pdf", "source": "https://www.drnidhi.net/writing/files/role-of-panchakarma-in-vandhyatwa-source.pdf", "apa": "Dr. Nidhi Sanjay Patel (2024). The Role of Panchakarma in Vandhyatwa (Female Infertility): A Comprehensive Review [Conference abstract]. Sushruta Seminar, Pune.", "vancouver": "1. Dr. Nidhi Sanjay Patel. The Role of Panchakarma in Vandhyatwa (Female Infertility): A Comprehensive Review [abstract]. Sushruta Seminar, Pune; 2024.", "bibtex": "@misc{the-role-of-panchakarma-in-vandhyatwa-fe,\n  author = {Dr. Nidhi Sanjay Patel},\n  title = {The Role of Panchakarma in Vandhyatwa (Female Infertility): A Comprehensive Review},\n  year = {2024},\n  school = {Sushruta Seminar, Pune},\n  keywords = {Panchakarma, Vandhyatwa, Female infertility, Shodhana, Shamana}\n}", "platforms": [{"key": "zenodo", "priority": 1}, {"key": "researchgate", "priority": 1}, {"key": "orcid", "priority": 2}, {"key": "scholar", "priority": 2}, {"key": "academia", "priority": 2}]}, {"slug": "delivery-of-iugr", "type": "Seminar", "typeLabel": "Seminar Presentation", "title": "Delivery of Intrauterine Growth Restriction (IUGR)", "hook": "When a fetus grows slowly, the clock is the diagnosis. This seminar covers surveillance, lung maturity and the delivery decision.", "abstract": "Intrauterine growth restriction is one of the most consequential complications of pregnancy, associated with elevated perinatal mortality and long-term neurodevelopmental impact. This seminar covers the aetiology and classification of fetal growth restriction, the antenatal surveillance methods including biophysical profile, amniotic fluid assessment, Doppler studies and the role of lung maturation, the significance of the L:S ratio and phosphatidylglycerol, and the timing and mode of delivery in the growth-restricted fetus. It also presents the Ayurvedic understanding of garbhapata and the adjunctive management of the maternal side, while emphasising the multidisciplinary surveillance required for these high-risk pregnancies.", "keywords": "IUGR; Fetal growth restriction; Oligohydramnios; Doppler; Prasuti Tantra; Ayurveda; Neonatal outcome; High-risk obstetrics", "year": 2024, "url": "https://www.drnidhi.net/writing/delivery-of-iugr.html", "pdf": "https://www.drnidhi.net/writing/files/delivery-of-iugr.pdf", "source": "https://www.drnidhi.net/writing/files/delivery-of-iugr-source.docx", "apa": "Dr. Nidhi Sanjay Patel (2024). Delivery of Intrauterine Growth Restriction (IUGR) [Seminar presentation]. Department of Prasuti Tantra & Stree Roga seminar series.", "vancouver": "1. Dr. Nidhi Sanjay Patel. Delivery of Intrauterine Growth Restriction (IUGR) [seminar presentation]; 2024; Department of Prasuti Tantra & Stree Roga seminar series.", "bibtex": "@misc{delivery-of-intrauterine-growth-restrict,\n  author = {Dr. Nidhi Sanjay Patel},\n  title = {Delivery of Intrauterine Growth Restriction (IUGR)},\n  year = {2024},\n  school = {Department of Prasuti Tantra & Stree Roga seminar series},\n  keywords = {IUGR, Fetal growth restriction, Oligohydramnios, Doppler, Prasuti Tantra}\n}", "platforms": [{"key": "zenodo", "priority": 2}, {"key": "academia", "priority": 2}, {"key": "slideshare", "priority": 2}, {"key": "orcid", "priority": 3}, {"key": "scribd", "priority": 3}]}, {"slug": "conceptual-approach-to-preconceptional-care-in-ayurveda", "type": "Abstract", "typeLabel": "Conference Abstract", "title": "The Conceptual Approach of Preconceptional Care in Ayurveda", "hook": "Ayurveda has a full pre-conception protocol — most modern fertility plans do not. This paper lays the classical framework out step by step.", "abstract": "Preconceptional care in Ayurveda emphasises a holistic approach to ensuring optimal health before conception. Nature has given the human body the great responsibility of pregnancy, and in the present era, where lifestyle-related issues and environmental factors affect fertility, couples seeking a \"Supraja\" — a healthy, physically, mentally and intellectually strong child — are drawn to Ayurvedic principles. A comprehensive review of Ayurvedic texts and contemporary studies was conducted, covering dietary recommendations, lifestyle modification and herbal interventions aimed at enhancing fertility, supplemented by practitioner survey and case-study insight. The findings indicate that Rutukal, Dinacharya, Rutucharya, Yogabhyasa, Panchakarma, Pranayama, Ahara-Vihara, Achar Rasayana, counselling, meditation, Garbhini Paricharya and targeted herbal interventions collectively contribute to enhanced fertility and improved overall health in both partners. The discussion underscores a sustainable path to conception that ensures parents are physically and mentally prepared before the journey ahead, and identifies the need for further research to quantify these benefits and integrate Ayurvedic principles with modern reproductive health practice.", "keywords": "Preconceptional care; Panchakarma; Garbhini Paricharya; Supraja; Fertility; Ayurveda; Rutukal; Dinacharya; Rasayana", "year": 2024, "url": "https://www.drnidhi.net/writing/conceptual-approach-to-preconceptional-care-in-ayurveda.html", "pdf": "https://www.drnidhi.net/writing/files/conceptual-approach-to-preconceptional-care-in-ayurveda.pdf", "source": "https://www.drnidhi.net/writing/files/conceptual-approach-to-preconceptional-care-in-ayurveda-source.docx", "apa": "Dr. Nidhi Sanjay Patel (2024). The Conceptual Approach of Preconceptional Care in Ayurveda [Conference abstract]. Belagavi National Seminar.", "vancouver": "1. Dr. Nidhi Sanjay Patel. The Conceptual Approach of Preconceptional Care in Ayurveda [abstract]. Belagavi National Seminar; 2024.", "bibtex": "@misc{the-conceptual-approach-of-preconception,\n  author = {Dr. Nidhi Sanjay Patel},\n  title = {The Conceptual Approach of Preconceptional Care in Ayurveda},\n  year = {2024},\n  school = {Belagavi National Seminar},\n  keywords = {Preconceptional care, Panchakarma, Garbhini Paricharya, Supraja, Fertility}\n}", "platforms": [{"key": "zenodo", "priority": 1}, {"key": "researchgate", "priority": 1}, {"key": "orcid", "priority": 2}, {"key": "scholar", "priority": 2}, {"key": "academia", "priority": 2}]}, {"slug": "ayurveda-for-public-health", "type": "Abstract", "typeLabel": "Conference Abstract", "title": "Ayurveda for Public Health", "hook": "Ayurveda was a public-health system long before the phrase existed. This abstract makes the case for its revival.", "abstract": "Ayurveda is an ancient medical science of human civilisation and a holistic health science that addresses the individual as well as the community. Owing to severe pollution, climate change, population growth and other socio-economic pressures, the world today faces a strong survival strain on all living beings and on nature; maintaining the wholeness of nature and human health is a pressing obligation that cannot be ignored. Ayurveda has distinctive advantages here, because it directly fulfils social health demands. Swasthavritta — the promotion of health — is among the strongest and most unique aspects of Ayurvedic medicine. Ayurveda places emphasis on rules of conduct and their effect on the social and behavioural aspects of life, addressing both preventive and curative dimensions of health and promoting wellbeing through organised community effort. Classical Ayurvedic texts already describe infectious disease, immunity and nutrition within their own idioms. With Dinacharya, Ritucharya, Rasayana and Vajikarana, individual health can be improved; and with Yoga, meditation and immune-modulating Ahara, the wider public-health aim can be met.", "keywords": "Public health; Swasthavritta; Ahara; Dinacharya; Ritucharya; Rasayana; Community medicine; Ayurveda; Prevention", "year": 2024, "url": "https://www.drnidhi.net/writing/ayurveda-for-public-health.html", "pdf": "https://www.drnidhi.net/writing/files/ayurveda-for-public-health.pdf", "source": "https://www.drnidhi.net/writing/files/ayurveda-for-public-health-source.docx", "apa": "Dr. Nidhi Sanjay Patel (2024). Ayurveda for Public Health [Conference abstract]. Ayurveda & Public Health symposium.", "vancouver": "1. Dr. Nidhi Sanjay Patel. Ayurveda for Public Health [abstract]. Ayurveda & Public Health symposium; 2024.", "bibtex": "@misc{ayurveda-for-public-health,\n  author = {Dr. Nidhi Sanjay Patel},\n  title = {Ayurveda for Public Health},\n  year = {2024},\n  school = {Ayurveda & Public Health symposium},\n  keywords = {Public health, Swasthavritta, Ahara, Dinacharya, Ritucharya}\n}", "platforms": [{"key": "zenodo", "priority": 1}, {"key": "researchgate", "priority": 1}, {"key": "orcid", "priority": 2}, {"key": "scholar", "priority": 2}, {"key": "academia", "priority": 2}]}, {"slug": "vomiting-in-pregnancy", "type": "Seminar", "typeLabel": "Seminar Presentation", "title": "Vomiting in Pregnancy: Nausea and Vomiting of Pregnancy in Ayurveda", "hook": "Nearly three-quarters of pregnancies involve nausea. This seminar covers what Ayurveda offers — and what it deliberately withholds.", "abstract": "Nausea and vomiting of pregnancy is one of the earliest and most universal symptoms of gestation, described in the classical texts as Garbhini Chardi. This seminar presents the Ayurvedic understanding of vomiting in pregnancy, the doshic basis of the condition, the classical diagnostic and therapeutic approach, the role of Ahara-Vihara and the specific formulations indicated in pregnancy with their indications, precautions and rationales, and the differentiation from the pathological vomiting of later pregnancy such as hyperemesis gravidarum. The presentation also addresses the limits of classical management and the point at which modern intervention is required, aiming to give the postgraduate audience a safe and practical synthesis.", "keywords": "Nausea and vomiting of pregnancy; Garbhini Chardi; Prasuti Tantra; Ayurveda; Maternal care; Drug review; Safe in pregnancy", "year": 2023, "url": "https://www.drnidhi.net/writing/vomiting-in-pregnancy.html", "pdf": "https://www.drnidhi.net/writing/files/vomiting-in-pregnancy.pdf", "source": "https://www.drnidhi.net/writing/files/vomiting-in-pregnancy-source.docx", "apa": "Dr. Nidhi Sanjay Patel (2023). Vomiting in Pregnancy: Nausea and Vomiting of Pregnancy in Ayurveda [Seminar presentation]. Department of Prasuti Tantra & Stree Roga seminar series.", "vancouver": "1. Dr. Nidhi Sanjay Patel. Vomiting in Pregnancy: Nausea and Vomiting of Pregnancy in Ayurveda [seminar presentation]; 2023; Department of Prasuti Tantra & Stree Roga seminar series.", "bibtex": "@misc{vomiting-in-pregnancy-nausea-and-vomitin,\n  author = {Dr. Nidhi Sanjay Patel},\n  title = {Vomiting in Pregnancy: Nausea and Vomiting of Pregnancy in Ayurveda},\n  year = {2023},\n  school = {Department of Prasuti Tantra & Stree Roga seminar series},\n  keywords = {Nausea and vomiting of pregnancy, Garbhini Chardi, Prasuti Tantra, Ayurveda, Maternal care}\n}", "platforms": [{"key": "zenodo", "priority": 2}, {"key": "academia", "priority": 2}, {"key": "slideshare", "priority": 2}, {"key": "orcid", "priority": 3}, {"key": "scribd", "priority": 3}]}, {"slug": "sadarasa-in-prasuti-tantra-and-stree-roga", "type": "Seminar", "typeLabel": "Seminar Presentation", "title": "Sadarasa in Prasuti Tantra & Stree Roga", "hook": "Ayurveda separated the mind from the body as a treatment axis long before psychology existed. This seminar covers the classical method.", "abstract": "Sadarasa — equipoise of mind — occupies a distinctive place in Ayurvedic theory, which holds that the mental component of disease is not an adjunct but a parallel axis of treatment. This seminar examines the concept of Sadarasa in relation to Prasuti Tantra and Stree Roga, exploring classical definitions of manas, the relationship between manas and sharira, the mechanisms by which psychological disturbance is described as a cause or an aggravating factor in disorders of menstruation, conception, pregnancy and the puerperium, and the classical therapeutic methods — including Sattvavajaya, Achara Rasayana and manas-antara treatment — used to restore balance. The presentation connects this framework to the modern clinical reality of stress-related menstrual and fertility complaints.", "keywords": "Sadarasa; Manas; Psychosomatic; Prasuti Tantra; Stree Roga; Ayurveda; Mental health; Sattvavajaya", "year": 2023, "url": "https://www.drnidhi.net/writing/sadarasa-in-prasuti-tantra-and-stree-roga.html", "pdf": "https://www.drnidhi.net/writing/files/sadarasa-in-prasuti-tantra-and-stree-roga.pdf", "source": "https://www.drnidhi.net/writing/files/sadarasa-in-prasuti-tantra-and-stree-roga-source.pdf", "apa": "Dr. Nidhi Sanjay Patel (2023). Sadarasa in Prasuti Tantra & Stree Roga [Seminar presentation]. Department of Prasuti Tantra & Stree Roga seminar series.", "vancouver": "1. Dr. Nidhi Sanjay Patel. Sadarasa in Prasuti Tantra & Stree Roga [seminar presentation]; 2023; Department of Prasuti Tantra & Stree Roga seminar series.", "bibtex": "@misc{sadarasa-in-prasuti-tantra-stree-roga,\n  author = {Dr. Nidhi Sanjay Patel},\n  title = {Sadarasa in Prasuti Tantra & Stree Roga},\n  year = {2023},\n  school = {Department of Prasuti Tantra & Stree Roga seminar series},\n  keywords = {Sadarasa, Manas, Psychosomatic, Prasuti Tantra, Stree Roga}\n}", "platforms": [{"key": "zenodo", "priority": 2}, {"key": "academia", "priority": 2}, {"key": "slideshare", "priority": 2}, {"key": "orcid", "priority": 3}, {"key": "scribd", "priority": 3}]}, {"slug": "role-of-dinacharya-for-immunity", "type": "Seminar", "typeLabel": "Seminar Presentation", "title": "Role of Dinacharya for Immunity", "hook": "Ayurveda does not have an \"immunity\" chapter — it has a daily schedule. This seminar shows how the two map onto each other.", "abstract": "Dinacharya is defined as the daily routine. According to Ayurveda, one should follow Dinacharya in order to lead a healthy and disease-free life. Ayurveda gives more emphasis on the prevention of disease than on its treatment, and Dinacharya is the practical vehicle for that principle: it establishes balance in one's constitution, regularises the biological clock, aids digestion, absorption and assimilation, and generates self-esteem, discipline, peace, happiness and longevity. This seminar presents Dinacharya as the daily immune strategy — a structured, timed sequence of Ahara, Vihara and Achara that keeps the doshas in balance and maintains the body's natural defence capacity, and contrasts it with modern behaviour-based approaches to immune resilience.", "keywords": "Dinacharya; Immunity; Ayurveda; Prevention; Swasthavritta; Lifestyle medicine; Ritucharya; Rasayana", "year": 2023, "url": "https://www.drnidhi.net/writing/role-of-dinacharya-for-immunity.html", "pdf": "https://www.drnidhi.net/writing/files/role-of-dinacharya-for-immunity.pdf", "source": "https://www.drnidhi.net/writing/files/role-of-dinacharya-for-immunity-source.pptx", "apa": "Dr. Nidhi Sanjay Patel (2023). Role of Dinacharya for Immunity [Seminar presentation]. Department of Prasuti Tantra & Stree Roga seminar series.", "vancouver": "1. Dr. Nidhi Sanjay Patel. Role of Dinacharya for Immunity [seminar presentation]; 2023; Department of Prasuti Tantra & Stree Roga seminar series.", "bibtex": "@misc{role-of-dinacharya-for-immunity,\n  author = {Dr. Nidhi Sanjay Patel},\n  title = {Role of Dinacharya for Immunity},\n  year = {2023},\n  school = {Department of Prasuti Tantra & Stree Roga seminar series},\n  keywords = {Dinacharya, Immunity, Ayurveda, Prevention, Swasthavritta}\n}", "platforms": [{"key": "zenodo", "priority": 2}, {"key": "academia", "priority": 2}, {"key": "slideshare", "priority": 2}, {"key": "orcid", "priority": 3}, {"key": "scribd", "priority": 3}]}, {"slug": "prasava-vigyana-ayurvedic-obstetrics", "type": "Seminar", "typeLabel": "Seminar Presentation", "title": "Prasava Vigyana — Ayurvedic Obstetrics", "hook": "Classical Ayurveda describes normal labour in remarkable detail. This seminar sets it against the modern partograph.", "abstract": "Prasava Vigyana is the classical science of management of labour. This seminar presents the Ayurvedic framework for the conduct of normal labour, working through the four stages of prajasma with their characteristic signs, the assessment of the onset of labour and the progress of the uterine contractions, the ahara-vihara and positional management advised in each stage, the use of the classical formulations indicated for each stage, and the management of the third stage including the prevention of postpartum haemorrhage and the care of the newborn. The classical model is set alongside contemporary evidence-based practice and partograph-based monitoring.", "keywords": "Prasava Vigyana; Labour management; Prasuti Tantra; Ayurveda; Partograph; Maternal care; Obstetrics", "year": 2023, "url": "https://www.drnidhi.net/writing/prasava-vigyana-ayurvedic-obstetrics.html", "pdf": "https://www.drnidhi.net/writing/files/prasava-vigyana-ayurvedic-obstetrics.pdf", "source": "https://www.drnidhi.net/writing/files/prasava-vigyana-ayurvedic-obstetrics-source.docx", "apa": "Dr. Nidhi Sanjay Patel (2023). Prasava Vigyana — Ayurvedic Obstetrics [Seminar presentation]. Department of Prasuti Tantra & Stree Roga seminar series.", "vancouver": "1. Dr. Nidhi Sanjay Patel. Prasava Vigyana — Ayurvedic Obstetrics [seminar presentation]; 2023; Department of Prasuti Tantra & Stree Roga seminar series.", "bibtex": "@misc{prasava-vigyana-ayurvedic-obstetrics,\n  author = {Dr. Nidhi Sanjay Patel},\n  title = {Prasava Vigyana — Ayurvedic Obstetrics},\n  year = {2023},\n  school = {Department of Prasuti Tantra & Stree Roga seminar series},\n  keywords = {Prasava Vigyana, Labour management, Prasuti Tantra, Ayurveda, Partograph}\n}", "platforms": [{"key": "zenodo", "priority": 2}, {"key": "academia", "priority": 2}, {"key": "slideshare", "priority": 2}, {"key": "orcid", "priority": 3}, {"key": "scribd", "priority": 3}]}, {"slug": "gestational-diabetes-mellitus", "type": "Seminar", "typeLabel": "Seminar Presentation", "title": "Gestational Diabetes Mellitus", "hook": "The diagnostic threshold for gestational diabetes changed in 2025. This seminar covers the screening, the surveillance and the classical alternatives.", "abstract": "Gestational diabetes mellitus is now the commonest medical complication of pregnancy and carries substantial maternal and fetal consequences, including macrosomia, hypertensive disorders and neonatal hypoglycaemia. This seminar covers the screening and diagnostic criteria, the glucose targets and monitoring required, the nutritional and lifestyle management of the condition, the pharmacological options, the intrapartum and postpartum management, and the long-term risk of progression to type 2 diabetes. Alongside the modern pathway, the presentation discusses the Ayurvedic understanding of madhumeha in pregnancy — the doshic basis, the classical ahara-vihara prescription and the role of herbo-mineral formulations — and evaluates where classical and contemporary management can be integrated responsibly.", "keywords": "Gestational diabetes mellitus; GDM; Madhumeha; Prasuti Tantra; Ayurveda; Metabolic health; Antenatal care; Macrosomia", "year": 2023, "url": "https://www.drnidhi.net/writing/gestational-diabetes-mellitus.html", "pdf": "https://www.drnidhi.net/writing/files/gestational-diabetes-mellitus.pdf", "source": "https://www.drnidhi.net/writing/files/gestational-diabetes-mellitus-source.docx", "apa": "Dr. Nidhi Sanjay Patel (2023). Gestational Diabetes Mellitus [Seminar presentation]. Department of Prasuti Tantra & Stree Roga seminar series.", "vancouver": "1. Dr. Nidhi Sanjay Patel. Gestational Diabetes Mellitus [seminar presentation]; 2023; Department of Prasuti Tantra & Stree Roga seminar series.", "bibtex": "@misc{gestational-diabetes-mellitus,\n  author = {Dr. Nidhi Sanjay Patel},\n  title = {Gestational Diabetes Mellitus},\n  year = {2023},\n  school = {Department of Prasuti Tantra & Stree Roga seminar series},\n  keywords = {Gestational diabetes mellitus, GDM, Madhumeha, Prasuti Tantra, Ayurveda}\n}", "platforms": [{"key": "zenodo", "priority": 2}, {"key": "academia", "priority": 2}, {"key": "slideshare", "priority": 2}, {"key": "orcid", "priority": 3}, {"key": "scribd", "priority": 3}]}, {"slug": "epilepsy-in-pregnancy", "type": "Seminar", "typeLabel": "Seminar Presentation", "title": "Epilepsy in Pregnancy", "hook": "Two-thirds of women with epilepsy are not seizure-free in pregnancy. This seminar covers the drug, dose and labour decisions that matter.", "abstract": "Epilepsy in pregnancy presents a dual therapeutic challenge: controlling seizures while avoiding harm to the fetus through medication, and managing the labour itself. This seminar reviews the epidemiology and classification of seizure disorders in pregnancy, the effect of pregnancy on seizure control, the principles of anti-epileptic drug management in the antenatal, intrapartum and postpartum periods including the teratogenic considerations, the management of eclampsia and status epilepticus, and the Ayurvedic understanding of the condition and its adjuvant role. The talk is aimed at equipping the postgraduate with a decision framework for a high-risk obstetric patient.", "keywords": "Epilepsy; Epileptic seizures; Pregnancy; Antiepileptic drugs; Prasuti Tantra; Ayurveda; Neuro-obstetrics", "year": 2023, "url": "https://www.drnidhi.net/writing/epilepsy-in-pregnancy.html", "pdf": "https://www.drnidhi.net/writing/files/epilepsy-in-pregnancy.pdf", "source": "https://www.drnidhi.net/writing/files/epilepsy-in-pregnancy-source.docx", "apa": "Dr. Nidhi Sanjay Patel (2023). Epilepsy in Pregnancy [Seminar presentation]. Department of Prasuti Tantra & Stree Roga seminar series.", "vancouver": "1. Dr. Nidhi Sanjay Patel. Epilepsy in Pregnancy [seminar presentation]; 2023; Department of Prasuti Tantra & Stree Roga seminar series.", "bibtex": "@misc{epilepsy-in-pregnancy,\n  author = {Dr. Nidhi Sanjay Patel},\n  title = {Epilepsy in Pregnancy},\n  year = {2023},\n  school = {Department of Prasuti Tantra & Stree Roga seminar series},\n  keywords = {Epilepsy, Epileptic seizures, Pregnancy, Antiepileptic drugs, Prasuti Tantra}\n}", "platforms": [{"key": "zenodo", "priority": 2}, {"key": "academia", "priority": 2}, {"key": "slideshare", "priority": 2}, {"key": "orcid", "priority": 3}, {"key": "scribd", "priority": 3}]}, {"slug": "effect-of-pumsavana-karma-in-conception", "type": "Article", "typeLabel": "Peer-Reviewed Journal Article", "title": "Effect of Pumsavana Karma in Conception", "hook": "\"Pumsavanam ithi pumsatva karakam karma\" — this article explains the Ayurvedic conception-care ritual that literally means \"the ritual that brings forth the child\".", "abstract": "Pumsavana Karma, the first of the Shodasha Samskaras, is performed to secure a healthy, intelligent and prosperous progeny — the classical aim of Suputrakameeya. The karma may be performed immediately prior to conception (Pushyanakshatra) and is directed at Garbhadharana (conception) and Garbhasthireekarana (the settling of the embryo). The 10th–16th day of the menstrual cycle is identified as the optimal window for conception, and Pushya Nakshatra — one of the fourteen Purusha Nakshatras and among the most auspicious for medicinal preparations and therapeutic administration — is the prescribed time for its performance. This article reviews the principles and practice of Pumsavana Karma, examining its rationale, timing, procedure and therapeutic intent, and presents it as a safe, cost-effective and evidence-informed approach to improving conception outcomes. The review positions Pumsavana as a bridge between classical Samskara doctrine and contemporary fertility-seeking practice.", "keywords": "Pumsavana Karma; Garbhasthireekarana; Garbhadharana; Pushyanakshatra; Shodasha Samskaras; Fertility; Ayurveda; Conception", "year": 2023, "url": "https://www.drnidhi.net/writing/effect-of-pumsavana-karma-in-conception.html", "pdf": "https://www.drnidhi.net/writing/files/effect-of-pumsavana-karma-in-conception.pdf", "source": "https://www.drnidhi.net/writing/files/effect-of-pumsavana-karma-in-conception-source.docx", "apa": "Dr. Nidhi Sanjay Patel, Dr. Kola Vijaya Kumari, M.D. (Ayu) — Professor & H.O.D., Department of Prasuti Tantra & Stree Roga (2023). Effect of Pumsavana Karma in Conception. International Journal of Creative Research Thoughts (IJCRT).", "vancouver": "1. Dr. Nidhi Sanjay Patel; 2. Dr. Kola Vijaya Kumari, M.D. (Ayu) — Professor & H.O.D., Department of Prasuti Tantra & Stree Roga. Effect of Pumsavana Karma in Conception. International Journal of Creative Research Thoughts (IJCRT); 2023.", "bibtex": "@article{effect-of-pumsavana-karma-in-conception,\n  author = {Dr. Nidhi Sanjay Patel and Dr. Kola Vijaya Kumari, M.D. (Ayu) — Professor & H.O.D., Department of Prasuti Tantra & Stree Roga},\n  title = {Effect of Pumsavana Karma in Conception},\n  year = {2023},\n  school = {International Journal of Creative Research Thoughts (IJCRT)},\n  keywords = {Pumsavana Karma, Garbhasthireekarana, Garbhadharana, Pushyanakshatra, Shodasha Samskaras}\n}", "platforms": [{"key": "zenodo", "priority": 1}, {"key": "orcid", "priority": 1}, {"key": "scholar", "priority": 1}, {"key": "researchgate", "priority": 1}, {"key": "academia", "priority": 2}, {"key": "linkedin", "priority": 2}]}, {"slug": "concepts-of-rasa-in-prasuti-tantra-and-stree-roga", "type": "Seminar", "typeLabel": "Seminar Presentation", "title": "Concepts of Rasa in Relation to Prasuti Tantra & Stree Roga", "hook": "Rasa is the most potent and the most restricted category in Ayurveda. This seminar explains where the line is drawn in women's health.", "abstract": "Rasa occupies a distinctive position in Ayurvedic pharmacology as the most refined and most potent preparation class, formed through shodhana, marana and bhavana processes. This seminar explores the concept of Rasa in relation to Prasuti Tantra and Stree Roga, tracing the classical definitions of rasa, the pharmacological action attributed to rasaushadhi, the relationship between rasa and agni, and the classical cautions governing their use across the reproductive life-cycle — particularly in pregnancy, where specific rasa preparations are contraindicated. The discussion also addresses the modern pharmacological framework of drug action and how rasaushadhi effects may be correlated with known therapeutic and adverse-reaction profiles, providing a grounded basis for their cautious clinical application.", "keywords": "Rasa; Rasaushadhi; Prasuti Tantra; Stree Roga; Ayurveda; Pharmacology; Agnidega; Bhavapaka", "year": 2023, "url": "https://www.drnidhi.net/writing/concepts-of-rasa-in-prasuti-tantra-and-stree-roga.html", "pdf": "https://www.drnidhi.net/writing/files/concepts-of-rasa-in-prasuti-tantra-and-stree-roga.pdf", "source": "https://www.drnidhi.net/writing/files/concepts-of-rasa-in-prasuti-tantra-and-stree-roga-source.docx", "apa": "Dr. Nidhi Sanjay Patel (2023). Concepts of Rasa in Relation to Prasuti Tantra & Stree Roga [Seminar presentation]. Department of Prasuti Tantra & Stree Roga seminar series.", "vancouver": "1. Dr. Nidhi Sanjay Patel. Concepts of Rasa in Relation to Prasuti Tantra & Stree Roga [seminar presentation]; 2023; Department of Prasuti Tantra & Stree Roga seminar series.", "bibtex": "@misc{concepts-of-rasa-in-relation-to-prasuti-,\n  author = {Dr. Nidhi Sanjay Patel},\n  title = {Concepts of Rasa in Relation to Prasuti Tantra & Stree Roga},\n  year = {2023},\n  school = {Department of Prasuti Tantra & Stree Roga seminar series},\n  keywords = {Rasa, Rasaushadhi, Prasuti Tantra, Stree Roga, Ayurveda}\n}", "platforms": [{"key": "zenodo", "priority": 2}, {"key": "academia", "priority": 2}, {"key": "slideshare", "priority": 2}, {"key": "orcid", "priority": 3}, {"key": "scribd", "priority": 3}]}, {"slug": "concept-of-pathya-in-prasuti-tantra-and-stree-roga", "type": "Seminar", "typeLabel": "Seminar Presentation", "title": "Concept of Pathya in Relation to Prasuti Tantra & Stree Roga", "hook": "Charaka lists pathya among the four pillars of treatment — before any drug is given, what the patient eats may decide the outcome.", "abstract": "In Vachaspata, the verse reads \"pathya-pathe, marge, hite chikitsad-au, hitakarakabhoktryadravyabhedahe\" — pathya is that which walks the path of benefit and is wholesome in ahi (food), vihara (conduct) and chikitsa (treatment). The word pathya derives from the root path, literally a way or channel. In Shabdakalpadrum, pathya is described as that which is beneficial to the patient, while apathya harms. Because the characteristics and properties of food change according to season, place and person, pathya must change accordingly. In the Yogaratnakara, the three most important factors in treating disease are etiology, drug treatment and pathya. Judicious planning of treatment by proper understanding of pathya therefore yields a far more effective eradication of disease than medicine alone. This seminar applies the principle of pathya specifically to Prasuti Tantra and Stree Roga, where dietary and behavioural regulation carries unusual weight across conception, pregnancy, labour and the puerperium.", "keywords": "Pathya; Apathya; Ahara; Prasuti Tantra; Stree Roga; Ayurveda; Dietetics; Preventive therapy", "year": 2023, "url": "https://www.drnidhi.net/writing/concept-of-pathya-in-prasuti-tantra-and-stree-roga.html", "pdf": "https://www.drnidhi.net/writing/files/concept-of-pathya-in-prasuti-tantra-and-stree-roga.pdf", "source": "https://www.drnidhi.net/writing/files/concept-of-pathya-in-prasuti-tantra-and-stree-roga-source.docx", "apa": "Dr. Nidhi Sanjay Patel (2023). Concept of Pathya in Relation to Prasuti Tantra & Stree Roga [Seminar presentation]. Department of Prasuti Tantra & Stree Roga seminar series.", "vancouver": "1. Dr. Nidhi Sanjay Patel. Concept of Pathya in Relation to Prasuti Tantra & Stree Roga [seminar presentation]; 2023; Department of Prasuti Tantra & Stree Roga seminar series.", "bibtex": "@misc{concept-of-pathya-in-relation-to-prasuti,\n  author = {Dr. Nidhi Sanjay Patel},\n  title = {Concept of Pathya in Relation to Prasuti Tantra & Stree Roga},\n  year = {2023},\n  school = {Department of Prasuti Tantra & Stree Roga seminar series},\n  keywords = {Pathya, Apathya, Ahara, Prasuti Tantra, Stree Roga}\n}", "platforms": [{"key": "zenodo", "priority": 2}, {"key": "academia", "priority": 2}, {"key": "slideshare", "priority": 2}, {"key": "orcid", "priority": 3}, {"key": "scribd", "priority": 3}]}, {"slug": "complications-of-stages-of-labour", "type": "Seminar", "typeLabel": "Seminar Presentation", "title": "Complications of the Stages of Labour", "hook": "Every stage of labour has a failure mode, and every failure mode has a clock. This seminar walks the three stages and their complications.", "abstract": "This seminar covers the complications that may arise at each of the three stages of labour — the first, second and third — and their management in the Ayurvedic obstetric framework. It addresses abnormal progress and the recognition of obstructed and prolonged labour, the management of postpartum haemorrhage and the third-stage complications of retained placenta and uterine atony, and the indications for referral. Presenting the classical approach to prasava-vyapad, the talk also builds the practical decision-making sequence a postgraduate must follow when a labour deviates from the expected course.", "keywords": "Labour; Dystocia; Postpartum haemorrhage; Obstetric complications; Prasuti Tantra; Ayurveda; Partograph; Safe motherhood", "year": 2023, "url": "https://www.drnidhi.net/writing/complications-of-stages-of-labour.html", "pdf": "https://www.drnidhi.net/writing/files/complications-of-stages-of-labour.pdf", "source": "https://www.drnidhi.net/writing/files/complications-of-stages-of-labour-source.docx", "apa": "Dr. Nidhi Sanjay Patel (2023). Complications of the Stages of Labour [Seminar presentation]. Department of Prasuti Tantra & Stree Roga seminar series.", "vancouver": "1. Dr. Nidhi Sanjay Patel. Complications of the Stages of Labour [seminar presentation]; 2023; Department of Prasuti Tantra & Stree Roga seminar series.", "bibtex": "@misc{complications-of-the-stages-of-labour,\n  author = {Dr. Nidhi Sanjay Patel},\n  title = {Complications of the Stages of Labour},\n  year = {2023},\n  school = {Department of Prasuti Tantra & Stree Roga seminar series},\n  keywords = {Labour, Dystocia, Postpartum haemorrhage, Obstetric complications, Prasuti Tantra}\n}", "platforms": [{"key": "zenodo", "priority": 2}, {"key": "academia", "priority": 2}, {"key": "slideshare", "priority": 2}, {"key": "orcid", "priority": 3}, {"key": "scribd", "priority": 3}]}, {"slug": "artava-kshya-oligohypomenorrhoea", "type": "Seminar", "typeLabel": "Seminar Presentation", "title": "Artava Kshaya (Oligohypomenorrhoea)", "hook": "Scanty periods are the most under-reported complaint in women's health and frequently the first sign of a fertility problem.", "abstract": "Artava Kshaya — scanty menstruation — is among the most under-reported complaints in Stree Roga, yet it is frequently the earliest signal of a fertility concern and is often dismissed by patients and clinicians alike. This seminar covers the classical definition and classification of Artava Kshaya, the doshic aetiology with particular reference to Vata and the role of Ama, the differential diagnosis from physiological variation and from other menstrual disorders including amenorrhoea, the investigation approach, and the therapeutic management combining ahara-vihara, aushadhi and specialised procedures such as Uttar Basti. The presentation also addresses the long-term consequences of untreated Artava Kshaya on reproductive health.", "keywords": "Artava Kshaya; Oligohypomenorrhoea; Hypomenorrhoea; Amenorrhoea; Prasuti Tantra; Ayurveda; Menstrual disorders; Fertility", "year": 2023, "url": "https://www.drnidhi.net on maps daily routine against modern environmental hazards.", "abstract": "This supervised compilation examines the role of Dinacharya — the classical daily regimen — in preventing the health hazards posed by pollution, in the Department of Swasthavritta, Parul Institute of Ayurveda, Parul University. The work surveys the classical framework of Ahara (diet), Vihara (behaviour) and their rules of combination, place, time, quantity and quality, and then maps each of the major contemporary pollution categories — air, water, soil, noise, light, thermal and radioactive — against the specific protective and remedial measures that Dinacharya prescribes. Because classical texts address pollution-related illness as an accumulation of doshas disturbed by specific etiological factors, the compilation argues that preventive daily routine is a more realistic first line of defence than any downstream treatment, particularly in communities where environmental exposure cannot be immediately controlled. The work concludes that a structured, seasonally appropriate daily routine remains a clinically meaningful and accessible intervention for pollution-related morbidity.", "keywords": "Dinacharya; Swasthavritta; Pollution; Preventive health; Ahara; Vihara; Ayurveda; Public health; Environmental health", "year": 2020, "url": "https://www.drnidhi.net/writing/role-of-dinacharya-in-prevention-of-health-hazards-of-pollution.html", "pdf": "https://www.drnidhi.net/writing/files/role-of-dinacharya-in-prevention-of-health-hazards-of-pollution.pdf", "source": "https://www.drnidhi.net/writing/files/role-of-dinacharya-in-prevention-of-health-hazards-of-pollution-source.pdf", "apa": "Dr. Nidhi Sanjay Patel (2020). Role of Dinacharya in the Prevention of Health Hazards of Pollution. Parul Institute of Ayurveda, Parul University, Vadodara — Department of Swasthavritta.", "vancouver": "1. Dr. Nidhi Sanjay Patel. Role of Dinacharya in the Prevention of Health Hazards of Pollution. Parul Institute of Ayurveda, Parul University, Vadodara — Department of Swasthavritta; 2020.", "bibtex": "@article{role-of-dinacharya-in-the-prevention-of-,\n  author = {Dr. Nidhi Sanjay Patel},\n  title = {Role of Dinacharya in the Prevention of Health Hazards of Pollution},\n  year = {2020},\n  school = {Parul Institute of Ayurveda, Parul University, Vadodara — Department of Swasthavritta},\n  keywords = {Dinacharya, Swasthavritta, Pollution, Preventive health, Ahara}\n}", "platforms": [{"key": "zenodo", "priority": 1}, {"key": "orcid", "priority": 1}, {"key": "scholar", "priority": 1}, {"key": "researchgate", "priority": 1}, {"key": "academia", "priority": 2}, {"key": "linkedin", "priority": 2}]}];
const KEY = 'drnidhi-upload-progress-v1';
let state = JSON.parse(localStorage.getItem(KEY) || '{}');
let current = 'all';

function save() { localStorage.setItem(KEY, JSON.stringify(state)); renderStats(); }
function id(slug, p) { return slug + '::' + p; }
function isDone(slug, p) { return !!state[id(slug, p)]; }

function renderStats() {
  let total = 0, done = 0;
  WORKS.forEach(w => w.platforms.forEach(p => { total++; if (isDone(w.slug, p.key)) done++; }));
  document.getElementById('totalCount').textContent = total;
  document.getElementById('doneCount').textContent = done;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('bar').style.width = pct + '%';
  document.querySelectorAll('nav button').forEach(b => {
    const k = b.dataset.key;
    const c = b.querySelector('span');
    if (k === 'all') c.textContent = total;
    else {
      let t = 0, d = 0;
      WORKS.forEach(w => w.platforms.filter(p => p.key === k).forEach(() => { t++; if (isDone(w.slug, k)) d++; }));
      c.textContent = d + '/' + t;
    }
  });
}

function buildNav() {
  const nav = document.getElementById('nav');
  const opts = [['all', 'All platforms']].concat(Object.entries(PLATFORMS).map(([k, v]) => [k, v.label]));
  nav.innerHTML = opts.map(([k, label]) => `<button data-key="${k}" class="${k === current ? 'on' : ''}">${label}<span></span></button>`).join('');
  nav.querySelectorAll('button').forEach(b => b.onclick = () => { current = b.dataset.key; buildNav(); render(); });
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function field(label, value, slug, name) {
  return `<div class="field"><div class="lbl"><span>${label}</span>
    <button class="copy" data-copy="${esc(value).replace(/"/g, '&quot;')}" data-key="${slug}::${name}">copy</button></div>
    <div class="val">${esc(value)}</div></div>`;
}

function render() {
  const main = document.getElementById('main');
  let cards = '';
  WORKS.forEach(w => {
    const list = current === 'all' ? w.platforms : w.platforms.filter(p => p.key === current);
    if (!list.length) return;
    list.forEach(p => {
      const pl = PLATFORMS[p.key];
      const done = isDone(w.slug, p.key);
      cards += `<div class="card ${done ? 'done' : ''}">
        <div class="top">
          <input type="checkbox" data-tick="${w.slug}::${p.key}" ${done ? 'checked' : ''}>
          <div>
            <span class="badge">${esc(pl.label)} · P${p.priority}</span>
            <div class="ttl">${esc(w.title)}</div>
            <div class="hook">${esc(w.hook)}</div>
          </div>
        </div>
        <div class="fields">
          ${field('Title', w.title, w.slug, 'title')}
          ${field('Short description / hook', w.hook, w.slug, 'hook')}
          ${field('Abstract', w.abstract, w.slug, 'abstract')}
          ${field('Keywords', w.keywords, w.slug, 'keywords')}
          ${field('APA citation', w.apa, w.slug, 'apa')}
          ${field('Canonical URL (always paste this)', w.url, w.slug, 'url')}
        </div>
        <div class="links">
          <a href="${esc(w.pdf)}" target="_blank" rel="noopener">open PDF ↗</a>
          <a href="${esc(w.source)}" target="_blank" rel="noopener">open source file ↗</a>
          <a href="${esc(pl.url)}" target="_blank" rel="noopener">${esc(pl.label)} upload page ↗</a>
          <span style="color:#93a4b8">${esc(pl.note)}</span>
        </div>
      </div>`;
    });
  });
  main.innerHTML = cards || '<div class="empty">Nothing here.</div>';

  main.querySelectorAll('[data-tick]').forEach(cb => {
    cb.onchange = () => {
      const k = cb.dataset.tick;
      if (cb.checked) state[k] = true; else delete state[k];
      save();
      cb.closest('.card').classList.toggle('done', cb.checked);
    };
  });

  main.querySelectorAll('.copy').forEach(btn => {
    btn.onclick = async () => {
      const text = btn.dataset.copy;
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e2) {}
        ta.remove();
      }
      btn.textContent = 'copied';
      btn.classList.add('ok');
      setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('ok'); }, 1200);
    };
  });
  renderStats();
}

document.getElementById('reset').onclick = (e) => {
  e.preventDefault();
  if (confirm('Clear all ticked progress?')) { state = {}; save(); buildNav(); render(); }
};

buildNav();
render();
</script>
</body>
